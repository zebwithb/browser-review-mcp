# Builds and checks every push and pull request. On main, when the version changed
# (the post-commit hook bumps it from Conventional Commits), it publishes a GitHub
# release v<version>, then signs and publishes to the stores whose keys are set
# (Firefox/Mozilla, npm, Chrome Web Store; see docs/releasing.md). Release files:
#   browser-review-<version>-chrome.zip   Chrome, Brave, Edge (one Chromium package)
#   browser-review-<version>-firefox.zip  Firefox 140+
#   browser-review-mcp-<version>.tgz      the MCP server, installable with npx
#   browser-review-<version>-firefox.xpi  signed by Mozilla (when AMO keys are set)
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Test and package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6 # pnpm version from "packageManager" in package.json

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Package the extension (Chrome/Brave/Edge and Firefox)
        run: pnpm package

      - name: Package the MCP server
        run: |
          pnpm --dir server build
          BRM_CLI=dist/cli.js node --test server/src/cli.test.ts
          pnpm --dir server pack --pack-destination ../release

      - name: Check the Firefox build with Mozilla's linter
        run: npx --yes web-ext lint --source-dir extension/dist-firefox --output text

      - name: Read the version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: List the packages
        run: ls -l release

      - uses: actions/upload-artifact@v7
        with:
          name: browser-review-${{ steps.version.outputs.version }}
          path: release/*
          if-no-files-found: error

  e2e:
    name: Chromium end to end
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --dir e2e exec playwright install --with-deps chromium

      - name: Build
        run: pnpm build

      - name: Test the extension and MCP server
        run: pnpm e2e

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-failure
          path: e2e/results/
          if-no-files-found: ignore

  release:
    name: GitHub release
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      created: ${{ steps.release.outputs.created }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags and history for the release notes

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false # no pnpm in this job

      - uses: actions/download-artifact@v8
        with:
          name: browser-review-${{ needs.build.outputs.version }}
          path: release

      - name: Create release v${{ needs.build.outputs.version }} (once per version)
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        # Safe to rerun: each step checks what is already there, and GitHub API
        # calls are retried (an outage once left an empty draft behind).
        run: |
          tag="v$VERSION"
          retry() {
            for i in 1 2 3 4 5; do
              "$@" && return 0
              echo "Failed, retrying in $((i * 15))s"
              sleep $((i * 15))
            done
            return 1
          }
          # "none" (new version), "true" (draft left by a failed run) or "false" (released).
          state=$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null || echo none)
          if [ "$state" = "false" ]; then
            echo "Release $tag already exists: the version did not change, nothing to publish."
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          prev=$(git tag --list 'v*' --sort=-v:refname | head -n 1)
          node scripts/release-notes.ts "$VERSION" "$prev" > notes.md
          cat notes.md
          make_draft() {
            gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --draft \
              --target "$GITHUB_SHA" --title "Browser Review $VERSION" --notes-file notes.md
          }
          retry make_draft
          retry gh release upload "$tag" release/* --clobber
          retry gh release edit "$tag" --draft=false --latest
          echo "created=true" >> "$GITHUB_OUTPUT"

  # ---------- signing and stores: each one runs once its secrets are set (see docs/releasing.md) ----------

  firefox:
    name: Sign for Firefox (Mozilla, unlisted)
    needs: [build, release]
    if: needs.release.outputs.created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45 # Mozilla's automatic review usually takes minutes
    permissions:
      contents: write # attach the signed .xpi to the release
    env:
      VERSION: ${{ needs.build.outputs.version }}
      WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
      WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Skip without Mozilla API keys
        if: env.WEB_EXT_API_KEY == '' || env.WEB_EXT_API_SECRET == ''
        run: echo "::notice::Firefox signing skipped. Add the AMO_JWT_ISSUER and AMO_JWT_SECRET secrets (docs/releasing.md)."

      - uses: actions/checkout@v7
        if: env.WEB_EXT_API_KEY != ''

      - uses: actions/setup-node@v7
        if: env.WEB_EXT_API_KEY != ''
        with:
          node-version-file: .nvmrc
          package-manager-cache: false # no pnpm in this job

      - uses: actions/download-artifact@v8
        if: env.WEB_EXT_API_KEY != ''
        with:
          name: browser-review-${{ needs.build.outputs.version }}
          path: release

      - name: Sign and attach to the release
        if: env.WEB_EXT_API_KEY != ''
        run: |
          mkdir -p firefox signed
          unzip -q "release/browser-review-$VERSION-firefox.zip" -d firefox
          # Mozilla reviews bundled code against its source: send the repo at this commit.
          git archive --format=zip -o source.zip HEAD
          npx --yes web-ext sign \
            --channel=unlisted \
            --source-dir firefox \
            --artifacts-dir signed \
            --upload-source-code source.zip \
            --approval-timeout 2400000
          xpi="browser-review-$VERSION-firefox.xpi"
          mv signed/*.xpi "$xpi"
          gh release upload "v$VERSION" "$xpi" --clobber

  npm:
    name: Publish browser-review-mcp to npm
    needs: [build, release]
    if: needs.release.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # npm trusted publishing and provenance
    env:
      VERSION: ${{ needs.build.outputs.version }}
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - uses: actions/download-artifact@v8
        with:
          name: browser-review-${{ needs.build.outputs.version }}
          path: release

      - name: Publish (once per version)
        run: |
          if npm view "browser-review-mcp@$VERSION" version >/dev/null 2>&1; then
            echo "browser-review-mcp@$VERSION is already on npm."
            exit 0
          fi
          if [ -n "$NPM_TOKEN" ]; then
            npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          elif ! npm view browser-review-mcp name >/dev/null 2>&1; then
            echo "::notice::npm publish skipped. Publish the first version by hand, then set up trusted publishing (docs/releasing.md)."
            exit 0
          fi
          npm install -g npm@latest # trusted publishing needs npm 11.5.1 or newer
          npm publish "release/browser-review-mcp-$VERSION.tgz" --access public --provenance

  chrome-web-store:
    name: Upload to the Chrome Web Store
    needs: [build, release]
    if: needs.release.outputs.created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERSION: ${{ needs.build.outputs.version }}
      CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
      CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
      CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
      CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
      CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
    steps:
      - name: Skip without Chrome Web Store credentials
        if: env.CWS_REFRESH_TOKEN == '' || env.CWS_EXTENSION_ID == ''
        run: echo "::notice::Chrome Web Store upload skipped. Add the CWS_* secrets and variables (docs/releasing.md)."

      - uses: actions/download-artifact@v8
        if: env.CWS_REFRESH_TOKEN != '' && env.CWS_EXTENSION_ID != ''
        with:
          name: browser-review-${{ needs.build.outputs.version }}
          path: release

      - name: Upload and submit for review
        if: env.CWS_REFRESH_TOKEN != '' && env.CWS_EXTENSION_ID != ''
        run: |
          api="https://chromewebstore.googleapis.com"
          item="publishers/$CWS_PUBLISHER_ID/items/$CWS_EXTENSION_ID"
          token=$(curl -sS --fail-with-body -X POST https://oauth2.googleapis.com/token \
            -d client_id="$CWS_CLIENT_ID" -d client_secret="$CWS_CLIENT_SECRET" \
            -d refresh_token="$CWS_REFRESH_TOKEN" -d grant_type=refresh_token | jq -r .access_token)
          echo "::add-mask::$token"
          echo "Uploading browser-review-$VERSION-chrome.zip"
          curl -sS --fail-with-body -X POST -H "Authorization: Bearer $token" \
            -T "release/browser-review-$VERSION-chrome.zip" "$api/upload/v2/$item:upload" | tee upload.json
          if grep -q IN_PROGRESS upload.json; then sleep 30; fi
          echo "Submitting for review"
          curl -sS --fail-with-body -X POST -H "Authorization: Bearer $token" "$api/v2/$item:publish"
